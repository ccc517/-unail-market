<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>U Nail Market</title>
<style>
:root{--bg:#fbf7f4;--card:#fff;--ink:#4d423f;--muted:#9d8c86;--line:#eaded9;--rose:#d9aaa6;--soft:#f3e4df;--green:#e8f0e9}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif;color:var(--ink)}
.app{max-width:720px;margin:auto;padding:20px 15px 110px}.brand{text-align:center;margin:10px 0 22px}.brand h1{font:30px Georgia,serif;letter-spacing:2px;margin:0}.brand small{color:var(--muted)}
.stats,.actions,.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat,.card{background:white;border:1px solid var(--line);border-radius:18px}.stat{padding:16px}.stat small{color:var(--muted)}.stat b{display:block;font-size:24px;margin-top:5px}
.actions{margin:13px 0 18px}.btn{border:0;border-radius:15px;padding:14px 10px;background:var(--soft);font-weight:700;color:var(--ink)}.btn.primary{background:var(--rose);color:#fff}.btn.ghost{background:#fff;border:1px solid var(--line)}
.tabs{display:flex;gap:5px;overflow:auto;margin-bottom:13px}.tab{border:0;background:transparent;padding:9px 11px;border-radius:99px;color:var(--muted);white-space:nowrap}.tab.on{background:var(--soft);color:var(--ink);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.product{position:relative;background:#fff;border:1px solid var(--line);border-radius:17px;overflow:hidden;text-align:left;padding:0;color:var(--ink)}.product.selected{outline:3px solid var(--rose)}.check{position:absolute;right:8px;top:8px;background:var(--rose);color:#fff;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900}.photo{aspect-ratio:1.15/1;background:#f2e7e2;display:flex;align-items:center;justify-content:center;color:#b6a09a;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover}.info{padding:11px}.info b{display:block}.muted{font-size:12px;color:var(--muted)}.badge{display:inline-block;font-size:11px;padding:4px 7px;border-radius:99px;background:#f3eae6;margin-top:6px}.ok{background:var(--green)}
.card{padding:14px;margin:9px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.empty{text-align:center;color:var(--muted);padding:35px 8px}
.cartbar{position:sticky;bottom:12px;margin-top:15px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px;box-shadow:0 12px 35px #5d463b22}.cartbar .btn{width:100%;margin-top:9px}
dialog{border:0;border-radius:22px;width:min(94vw,590px);max-height:92vh;overflow:auto;padding:0;box-shadow:0 25px 80px #0003}dialog::backdrop{background:#55484455}.modal{padding:19px;background:var(--bg)}
label{display:block;font-size:12px;color:var(--muted)}input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:16px;color:var(--ink);margin:5px 0 10px}textarea{min-height:70px}.upload{border:1px dashed #d6c1ba;border-radius:14px;padding:14px;background:#fff;text-align:center}.preview{display:none;width:100%;max-height:220px;object-fit:contain;border-radius:12px;margin:10px 0}.notice{background:#f5e9e4;padding:11px;border-radius:12px;font-size:12px;line-height:1.6;margin:8px 0}
.receipt{background:#fff;border:1px dashed #d6c1ba;border-radius:16px;padding:16px}.footer{text-align:center;color:#b8aaa5;font-size:10px;margin-top:25px}
</style></head>
<body><main class="app">
<div class="brand"><h1>U Nail Market</h1><small>市集小幫手</small></div>
<div class="stats"><div class="stat"><small>今日營業額</small><b id="rev">$0</b></div><div class="stat"><small>今日售出</small><b id="sold">0 副</b></div></div>
<div class="actions"><button class="btn primary" onclick="startSale()">＋ 現貨成交</button><button class="btn" onclick="setView('pre',document.querySelectorAll('.tab')[2])">🎀 預購管理</button></div>
<nav class="tabs"><button class="tab on" onclick="setView('products',this)">商品圖庫</button><button class="tab" onclick="setView('today',this)">今日紀錄</button><button class="tab" onclick="setView('pre',this)">預購管理</button><button class="tab" onclick="setView('close',this)">收攤統計</button><button class="tab" onclick="setView('backup',this)">備份</button></nav>
<section id="content"></section><div class="footer">資料與照片儲存在這台裝置的瀏覽器</div>
</main>

<dialog id="prodDlg"><form class="modal" onsubmit="addProduct(event)"><h2>新增商品</h2>
<label class="upload">📷 選商品照片<input id="img" type="file" accept="image/*" style="display:none" onchange="readImg(event)"><img id="preview" class="preview"></label>
<label>款式名稱</label><input id="name" required><div class="two"><div><label>尺寸（可複選）</label>
<div id="sizeChecks" style="display:flex;flex-wrap:wrap;gap:8px;margin:7px 0 10px">
<label class="badge" style="font-size:14px"><input type="checkbox" name="prodSize" value="XS" style="width:auto;margin-right:5px">XS</label>
<label class="badge" style="font-size:14px"><input type="checkbox" name="prodSize" value="S" style="width:auto;margin-right:5px">S</label>
<label class="badge" style="font-size:14px"><input type="checkbox" name="prodSize" value="M" style="width:auto;margin-right:5px">M</label>
<label class="badge" style="font-size:14px"><input type="checkbox" name="prodSize" value="L" style="width:auto;margin-right:5px">L</label>
<label class="badge" style="font-size:14px"><input type="checkbox" name="prodSize" value="其他" style="width:auto;margin-right:5px">其他</label>
</div></div><div><label>正確售價</label><input id="price" type="number" inputmode="numeric" placeholder="例如 690" required></div></div>
<label>販售類型</label><select id="kind"><option>現貨限定</option><option>可預購</option><option>可做相似款</option></select><label>庫存</label><input id="qty" type="number" value="1" min="0">
<div class="actions"><button type="button" class="btn ghost" onclick="prodDlg.close()">取消</button><button class="btn primary">儲存商品</button></div></form></dialog>

<dialog id="checkoutDlg"><form class="modal" onsubmit="checkout(event)"><h2>確認結帳</h2><div id="checkoutItems"></div><div class="row"><b>共 <span id="checkoutQty">0</span> 副</b><b id="checkoutTotal">$0</b></div>
<label>付款方式</label><select id="pay"><option>現金</option><option>轉帳</option><option>LINE Pay</option><option>其他</option></select><div id="gift" class="notice"></div>
<div class="actions"><button type="button" class="btn ghost" onclick="checkoutDlg.close()">返回</button><button class="btn primary">完成成交</button></div></form></dialog>

<dialog id="preDlg"><form class="modal" onsubmit="addPreorder(event)"><h2>新增預購</h2>
<label>客人姓名</label><input id="preName" required>
<div class="two"><div><label>IG</label><input id="preIg" placeholder="@帳號"></div><div><label>手機</label><input id="prePhone" inputmode="tel"></div></div>
<label>預購商品</label><select id="preProduct" required></select>
<div class="two"><div><label>尺寸</label><select id="preSize"><option>XS</option><option>S</option><option>M</option><option>L</option><option>其他</option></select></div><div><label>數量</label><input id="preQty" type="number" min="1" value="1" required></div></div>
<div class="two"><div><label>單價</label><input id="prePrice" type="number" inputmode="numeric" required></div><div><label>已收訂金</label><input id="preDeposit" type="number" inputmode="numeric" value="200" required></div></div>
<label>取貨方式</label><select id="prePickup"><option>現場取貨</option><option>賣貨便</option></select>
<label>備註</label><textarea id="preNote" placeholder="例如：指定款式、取貨方式"></textarea>
<div class="actions"><button type="button" class="btn ghost" onclick="preDlg.close()">取消</button><button class="btn primary">建立預購</button></div></form></dialog>

<script>
const $=x=>document.getElementById(x), M=n=>"$"+Number(n||0).toLocaleString("zh-TW"), DAY=()=>new Date().toLocaleDateString("sv-SE");
const STORAGE_KEY="UNAIL_MARKET_MASTER_V1";
const SCHEMA_VERSION=1;
function emptyDB(){return {
  schemaVersion:SCHEMA_VERSION,
  products:[],
  orders:[],
  preorders:[],
  settings:{deposit:200,fee:20,gift1:600,gift2:1200},
  createdAt:new Date().toISOString(),
  updatedAt:new Date().toISOString()
}}
function migrateDB(){
  const master=localStorage.getItem(STORAGE_KEY);
  if(master){
    try{
      const parsed=JSON.parse(master);
      parsed.schemaVersion=parsed.schemaVersion||1;
      parsed.settings=parsed.settings||{deposit:200,fee:20,gift1:600,gift2:1200};
      return parsed;
    }catch(e){}
  }
  // 自動接舊版資料，避免改版後商品消失
  const oldKeys=["UNAIL_CART_V1","UNAIL_IMG_V1","unailMarketV2","unailMarket"];
  for(const key of oldKeys){
    const raw=localStorage.getItem(key);
    if(!raw) continue;
    try{
      const old=JSON.parse(raw), n=emptyDB();
      n.products=(old.products||[]).map((p,i)=>({
        id:p.id||("P_"+Date.now()+"_"+i),
        name:p.name||p.product||"未命名商品",
        size:p.size||"S",
        price:Number(p.price||0),
        kind:p.kind||p.type||"現貨限定",
        qty:Number(p.qty??1),
        img:p.img||"",
        archived:false,
        createdAt:new Date().toISOString()
      }));
      n.orders=old.orders||old.sales?.filter?.(x=>x.type==="現貨")||[];
      n.preorders=old.preorders||old.sales?.filter?.(x=>x.type==="預購")||[];
      if(old.gift1||old.gift2||old.deposit||old.fee){
        n.settings={
          deposit:Number(old.deposit||200),
          fee:Number(old.fee||old.pickupFee||20),
          gift1:Number(old.gift1||600),
          gift2:Number(old.gift2||1200)
        };
      }
      localStorage.setItem(STORAGE_KEY,JSON.stringify(n));
      return n;
    }catch(e){}
  }
  return emptyDB();
}
let db=migrateDB();
let view="products",cart=[],imgData="";
function save(){
  db.updatedAt=new Date().toISOString();
  try{ localStorage.setItem(STORAGE_KEY,JSON.stringify(db)); return true; }
  catch(err){ alert("資料儲存空間不足。請先匯出備份；商品照片會自動壓縮，若仍出現此訊息請告訴我。"); return false; }
}
function readImg(e){
  const f=e.target.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    const im=new Image();
    im.onload=()=>{
      const max=420, scale=Math.min(1,max/Math.max(im.width,im.height));
      const cv=document.createElement("canvas"); cv.width=Math.max(1,Math.round(im.width*scale)); cv.height=Math.max(1,Math.round(im.height*scale));
      cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);
      imgData=cv.toDataURL("image/jpeg",0.58);
      $("preview").src=imgData; $("preview").style.display="block";
    };
    im.src=r.result;
  };
  r.readAsDataURL(f);
}
function addProduct(e){
  e.preventDefault();
  const sizes=[...document.querySelectorAll('input[name="prodSize"]:checked')].map(x=>x.value);
  if(!sizes.length){alert("請至少選擇一個尺寸");return;}
  const base={name:$("name").value,price:+$("price").value,kind:$("kind").value,qty:+$("qty").value,img:imgData,archived:false,createdAt:new Date().toISOString()};
  sizes.forEach((size,i)=>db.products.push({...base,id:(crypto.randomUUID?crypto.randomUUID():"I"+Date.now()+"_"+i+"_"+Math.random().toString(36).slice(2)),size}));
  save();
  e.target.reset();
  imgData="";
  $("preview").style.display="none";
  prodDlg.close();
  render();
}
function setView(v,b){view=v;cart=[];document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));if(b)b.classList.add("on");render()}
function totals(){let os=db.orders.filter(x=>x.date===DAY());let deps=db.preorders.filter(x=>x.date===DAY()).reduce((s,p)=>s+Number(p.deposit||0),0);$("rev").textContent=M(os.reduce((s,o)=>s+Number(o.total||0),0)+deps);$("sold").textContent=os.reduce((s,o)=>s+o.items.reduce((n,i)=>n+Number(i.qty||1),0),0)+" 副"}
function card(p,select=false){let sel=cart.includes(p.id);return `<button class="product ${sel?"selected":""}" onclick="${select?`toggleCart('${p.id}')`:`editProduct('${p.id}')`}">${sel?'<span class=check>✓</span>':""}<div class=photo>${p.img?`<img src="${p.img}">`:"尚無照片"}</div><div class=info><b>${p.name}</b><span class=muted>${p.size} · ${M(p.price)}</span><br><span class="badge ${p.qty>0?"ok":""}">${p.qty>0?"庫存 "+p.qty:"SOLD OUT"}</span><div class=muted style="margin-top:5px">${p.kind}</div></div></button>`}
function render(){totals();let c=$("content");
if(view==="products")c.innerHTML=`<button class="btn primary" style="width:100%;margin-bottom:12px" onclick="prodDlg.showModal()">＋ 新增商品照片</button>`+(db.products.length?`<div class=grid>${db.products.filter(p=>!p.archived).map(p=>card(p)).join("")}</div>`:`<div class=empty>目前是空白商品庫。<br>請把你的穿戴甲照片、尺寸與正確價格加進來 🤍</div>`);
if(view==="sale"){let avail=db.products.filter(p=>p.qty>0&&!p.archived);let total=cart.reduce((s,id)=>s+(db.products.find(p=>p.id===id)?.price||0),0);c.innerHTML=`<div class=row style="margin-bottom:10px"><b>點選客人要買的商品</b><button class="btn ghost" onclick="setView('products',document.querySelectorAll('.tab')[0])">取消</button></div>`+(avail.length?`<div class=grid>${avail.map(p=>card(p,true)).join("")}</div>`:`<div class=empty>目前沒有現貨。</div>`)+(cart.length?`<div class=cartbar><div class=row><b>已選 ${cart.length} 副</b><b>${M(total)}</b></div><div class=muted>點錯商品，再點一次即可取消。</div><button class="btn primary" onclick="openCheckout()">結帳 ${M(total)}</button></div>`:"")}
if(view==="today"){let a=db.orders.filter(o=>o.date===DAY()).reverse();c.innerHTML=a.length?a.map(o=>`<div class=card><div class=row><b>${o.items.reduce((n,i)=>n+Number(i.qty||1),0)} 副 · ${M(o.total)}</b><span class=badge>${o.pay}</span></div><div class=muted>${o.items.map(i=>i.name+" "+i.size).join("、")}</div><button class="btn ghost" style="width:100%;margin-top:10px" onclick="cancelOrder('${o.id}')">取消這筆訂單</button></div>`).join(""):`<div class=empty>今天還沒有成交。</div>`}
if(view==="pre"){let ps=db.preorders.slice().reverse();c.innerHTML=`<button class="btn primary" style="width:100%;margin-bottom:12px" onclick="openPreorder()">＋ 新增預購</button>`+(ps.length?ps.map(p=>{let fee=Number(p.fee||0),total=Number(p.price||0)*Number(p.qty||1)+fee,balance=Math.max(0,total-Number(p.deposit||0));return `<div class=card><div class=row><b>${p.customer} · ${p.productName}</b><span class="badge ${p.status==='已完成'?'ok':''}">${p.status||'等待到貨'}</span></div><div class=muted>${p.size} × ${p.qty}｜${p.ig||'無 IG'}｜${p.phone||'無手機'}</div><p style="margin:8px 0">總額 ${M(total)}｜已收訂金 ${M(p.deposit)}｜<b>尾款 ${M(balance)}</b></p>${p.note?`<div class=muted>備註：${p.note}</div>`:''}<div class="actions" style="margin-bottom:0">${p.status==='等待到貨'?`<button class=btn onclick="setPreStatus('${p.id}','已到貨')">標記已到貨</button>`:''}${p.status==='已到貨'?`<button class="btn primary" onclick="completePreorder('${p.id}')">收尾款・完成</button>`:''}${p.status==='已完成'?`<button class="btn ghost" disabled>已完成</button>`:''}<button class="btn ghost" onclick="deletePreorder('${p.id}')">刪除</button></div></div>`}).join(''):`<div class=empty>目前沒有預購。<br>按上方「新增預購」建立第一筆。</div>`) }
if(view==="close"){let a=db.orders.filter(o=>o.date===DAY()),cash=a.filter(o=>o.pay==="現金").reduce((s,o)=>s+Number(o.total||0),0),tr=a.filter(o=>o.pay==="轉帳").reduce((s,o)=>s+Number(o.total||0),0),linepay=a.filter(o=>o.pay==="LINE Pay").reduce((s,o)=>s+Number(o.total||0),0),deps=db.preorders.filter(p=>p.date===DAY()).reduce((s,p)=>s+Number(p.deposit||0),0),sales=a.reduce((s,o)=>s+Number(o.total||0),0);c.innerHTML=`<div class=card><h2>🌙 今日收攤</h2><p>成交 ${a.length} 筆｜售出 ${a.reduce((s,o)=>s+o.items.reduce((n,i)=>n+Number(i.qty||1),0),0)} 副</p><p>現金 ${M(cash)}｜轉帳 ${M(tr)}｜LINE Pay ${M(linepay)}</p><div class=row><span>今日成交／尾款</span><b>${M(sales)}</b></div><div class=row><span>今日預購訂金</span><b>${M(deps)}</b></div><hr style="border:0;border-top:1px solid var(--line);margin:12px 0"><div class=row><b>今日總收款</b><b>${M(sales+deps)}</b></div></div>`}
if(view==="backup"){c.innerHTML=`<div class=card>
<h2 style="margin-top:0">資料安全與備份</h2>
<p class=muted>商品、照片、訂單、預購資料都使用固定資料格式保存。之後加新功能時，不需要重新歸檔。</p>
<div class=notice>建議：大量新增商品前先備份一次；市集結束後再備份一次。</div>
<button class="btn primary" style="width:100%;margin:6px 0" onclick="exportBackup()">⬇️ 匯出完整備份</button>
<label style="margin-top:14px">還原備份</label>
<input id="restoreFile" type="file" accept=".json,application/json" onchange="restoreBackup(event)">
<div class=muted>還原前系統會先自動保存目前資料的安全副本。</div>
</div>`}}
function startSale(){view="sale";document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));render()}
function toggleCart(id){cart=cart.includes(id)?cart.filter(x=>x!==id):[...cart,id];render()}
function openCheckout(){let items=cart.map(id=>db.products.find(p=>p.id===id)),total=items.reduce((s,p)=>s+p.price,0);$("checkoutItems").innerHTML=items.map(p=>`<div class=card><div class=row><b>${p.name} · ${p.size}</b><b>${M(p.price)}</b></div></div>`).join("");$("checkoutQty").textContent=items.length;$("checkoutTotal").textContent=M(total);$("gift").textContent=total>=db.settings.gift2?`🎁 已達 ${M(db.settings.gift2)}：收納夾鏈袋＋收納盒`:total>=db.settings.gift1?`🎁 已達 ${M(db.settings.gift1)}：記得送收納盒`:"尚未達滿額贈";checkoutDlg.showModal()}
function checkout(e){e.preventDefault();let items=cart.map(id=>db.products.find(p=>p.id===id)),total=items.reduce((s,p)=>s+p.price,0);db.orders.push({id:"O"+Date.now(),date:DAY(),items:items.map(p=>({id:p.id,name:p.name,size:p.size,price:p.price})),total,pay:$("pay").value});items.forEach(p=>p.qty=Math.max(0,p.qty-1));save();cart=[];checkoutDlg.close();view="today";render()}
function cancelOrder(id){
  let o=db.orders.find(x=>x.id===id);
  if(!o)return;
  if(!confirm(`確定取消這筆 ${M(o.total)} 的訂單？\n取消後會自動修正今日營業額。`))return;

  if(o.source==="preorder" && o.preorderId){
    let pre=db.preorders.find(p=>p.id===o.preorderId);
    if(pre){
      pre.status="已到貨";
      delete pre.completedAt;
      delete pre.balancePaid;
      delete pre.balancePay;
    }
  }else{
    (o.items||[]).forEach(i=>{
      let p=db.products.find(x=>x.id===i.id);
      if(p)p.qty=Number(p.qty||0)+Number(i.qty||1);
    });
  }

  db.orders=db.orders.filter(x=>x.id!==id);
  save();
  render();
}

function openPreorder(){let opts=db.products.filter(p=>!p.archived&&p.kind!=="現貨限定");$("preProduct").innerHTML='<option value="">請選擇商品</option>'+opts.map(p=>`<option value="${p.id}">${p.name} · ${p.size} · ${M(p.price)}</option>`).join('');$("preDeposit").value=db.settings.deposit||200;$("preProduct").onchange=()=>{let p=db.products.find(x=>x.id===$("preProduct").value);if(p){$("prePrice").value=p.price;$("preSize").value=p.size}};preDlg.showModal()}
function addPreorder(e){e.preventDefault();let product=db.products.find(x=>x.id===$("preProduct").value);if(!product)return alert("請選擇預購商品");db.preorders.push({id:"PRE"+Date.now(),date:DAY(),createdAt:new Date().toISOString(),customer:$("preName").value.trim(),ig:$("preIg").value.trim(),phone:$("prePhone").value.trim(),productId:product.id,productName:product.name,size:$("preSize").value,qty:Math.max(1,+$("preQty").value||1),price:+$("prePrice").value||0,deposit:+$("preDeposit").value||0,pickup:$("prePickup").value,fee:0,note:$("preNote").value.trim(),status:"等待到貨"});save();e.target.reset();$("preQty").value=1;$("preDeposit").value=db.settings.deposit||200;preDlg.close();view="pre";render()}
function setPreStatus(id,status){let p=db.preorders.find(x=>x.id===id);if(!p)return;p.status=status;save();render()}
function completePreorder(id){let p=db.preorders.find(x=>x.id===id);if(!p||p.status==='已完成')return;let total=Number(p.price||0)*Number(p.qty||1),balance=Math.max(0,total-Number(p.deposit||0));let pay=prompt(`尾款 ${M(balance)}\n付款方式請輸入：現金／轉帳／LINE Pay／其他`,`現金`);if(pay===null)return;db.orders.push({id:"O"+Date.now(),date:DAY(),source:"preorder",preorderId:p.id,items:[{id:p.productId,name:p.productName,size:p.size,price:Number(p.price||0),qty:Number(p.qty||1)}],total:balance,pay:pay||"其他",depositAlreadyPaid:Number(p.deposit||0),fullTotal:total});p.status="已完成";p.completedAt=new Date().toISOString();p.balancePaid=balance;p.balancePay=pay||"其他";save();render()}
function deletePreorder(id){let p=db.preorders.find(x=>x.id===id);if(!p)return;if(confirm(`確定刪除 ${p.customer} 的預購？`)){db.preorders=db.preorders.filter(x=>x.id!==id);save();render()}}
function editProduct(id){let p=db.products.find(x=>x.id===id),v=prompt(`${p.name}｜${p.size}｜${M(p.price)}\n目前庫存 ${p.qty}\n輸入新的庫存數量：`,p.qty);if(v!==null&&!isNaN(+v)){p.qty=Math.max(0,+v);save();render()}}

function exportBackup(){
  const payload={
    app:"U Nail Market",
    schemaVersion:db.schemaVersion||SCHEMA_VERSION,
    exportedAt:new Date().toISOString(),
    data:db
  };
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=`U-Nail-Market-backup-${DAY()}.json`;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1500);
}
function restoreBackup(e){
  const file=e.target.files[0]; if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const parsed=JSON.parse(reader.result);
      const incoming=parsed.data||parsed;
      if(!incoming.products||!Array.isArray(incoming.products)) throw new Error("格式不正確");
      // 先保留目前資料的安全副本
      localStorage.setItem(STORAGE_KEY+"_AUTO_BEFORE_RESTORE_"+Date.now(),JSON.stringify(db));
      db=incoming;
      db.schemaVersion=db.schemaVersion||SCHEMA_VERSION;
      db.settings=db.settings||{deposit:200,fee:20,gift1:600,gift2:1200};
      save();
      alert("備份已成功還原。");
      render();
    }catch(err){
      alert("這個檔案不是有效的 U Nail Market 備份。");
    }
  };
  reader.readAsText(file);
  e.target.value="";
}

function shrinkStoredImage(src,max=420,quality=0.58){
  return new Promise(resolve=>{
    if(!src||!src.startsWith("data:image/")) return resolve(src);
    const im=new Image();
    im.onload=()=>{
      if(Math.max(im.width,im.height)<=max && src.length<70000) return resolve(src);
      const scale=Math.min(1,max/Math.max(im.width,im.height));
      const cv=document.createElement("canvas");
      cv.width=Math.max(1,Math.round(im.width*scale));
      cv.height=Math.max(1,Math.round(im.height*scale));
      cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);
      resolve(cv.toDataURL("image/jpeg",quality));
    };
    im.onerror=()=>resolve(src);
    im.src=src;
  });
}
async function optimizeExistingProductPhotos(){
  const flag="UNAIL_PHOTO_OPTIMIZED_420_V1";
  if(localStorage.getItem(flag)==="1") return;
  let changed=0;
  for(const p of db.products){
    if(p.img&&p.img.startsWith("data:image/")){
      const smaller=await shrinkStoredImage(p.img);
      if(smaller!==p.img){p.img=smaller;changed++;}
    }
  }
  if(changed){
    if(!save()) return;
  }
  localStorage.setItem(flag,"1");
  if(changed) render();
}

render();
setTimeout(optimizeExistingProductPhotos,300);
